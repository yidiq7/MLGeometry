name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing. Replaces a stored API token.
      id-token: write 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The package is pure Python, so the wheel is py3-none-any and the build
          # interpreter only has to be at least requires-python.
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
